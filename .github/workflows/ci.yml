name: CI / CD

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build_and_test:
    name: Build and Lint Next.js
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "yarn"

      - name: Install root dependencies
        run: yarn install --frozen-lockfile

      - name: Install frontend dependencies
        run: npm --prefix cortex-platform/frontend ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check backend compilation
        run: yarn check:backend

      - name: Lint Next.js site
        run: yarn lint

      - name: Lint frontend workspace
        run: npm --prefix cortex-platform/frontend run lint

      - name: Typecheck frontend workspace
        run: yarn typecheck:workspace

      - name: Test frontend workspace
        run: npm --prefix cortex-platform/frontend run test

      - name: Build all applications
        run: yarn build:all
