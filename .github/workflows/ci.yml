name: CI / CD

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  nextjs_build_and_lint:
    name: Build and Lint Next.js Site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint Next.js code
        run: yarn lint

      - name: Build Next.js application
        run: yarn build

  frontend_workspace:
    name: Frontend Workspace (Type-Check, Test, Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Workspace dependencies
        run: npm ci
        working-directory: cortex-platform/frontend

      - name: Type Check Frontend Workspace
        run: npm run type-check
        working-directory: cortex-platform/frontend

      - name: Run Frontend Workspace Tests
        run: npm test -- --reporter=dot
        working-directory: cortex-platform/frontend

      - name: Build Frontend Workspace
        run: npm run build
        working-directory: cortex-platform/frontend

  backend_validation:
    name: Backend Syntax Check & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Syntax check backend
        run: python3 -m compileall -q cortex-platform/backend/app

      - name: Run Backend Unit Tests
        run: uv run pytest -m "not e2e and not skill_github_e2e" --ignore=tests/test_api_file.py --ignore=tests/test_auth_routes.py --ignore=tests/test_sandbox_file.py
        working-directory: cortex-platform/backend
