name: CI / CD

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build_and_test:
    name: Full CI/CD (Next.js, Vue Frontend, Python Backend)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "yarn"

      - name: Setup Python & uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"

      - name: Install root dependencies
        run: yarn install --frozen-lockfile

      - name: Install frontend workspace dependencies
        run: npm --prefix cortex-platform/frontend ci

      - name: Lint Next.js site
        run: yarn lint

      - name: Build Next.js site
        run: yarn build

      - name: Type-check Vue workspace frontend
        run: yarn typecheck:workspace

      - name: Build Vue workspace frontend
        run: yarn build:workspace

      - name: Run Vue workspace frontend tests
        run: yarn test:frontend

      - name: Check Python backend compilation
        run: yarn check:backend

      - name: Run Python backend unit tests
        run: yarn test:backend
