name: CI / CD

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build_and_test:
    name: Build and Test Platform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "yarn"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install root Yarn dependencies
        run: yarn install --frozen-lockfile

      - name: Lint Next.js site
        run: yarn lint

      - name: Build Next.js application
        run: yarn build

      - name: Install frontend workspace dependencies
        run: npm --prefix cortex-platform/frontend ci

      - name: Type-check Vue frontend workspace
        run: yarn typecheck:workspace

      - name: Test Vue frontend workspace
        run: yarn test:frontend

      - name: Build Vue frontend workspace
        run: yarn build:workspace

      - name: Check Python backend syntax
        run: yarn check:backend

      - name: Install Python backend dependencies
        working-directory: cortex-platform/backend
        run: uv sync

      - name: Test Python backend
        working-directory: cortex-platform/backend
        run: uv run pytest -m "not e2e and not skill_github_e2e" --ignore=tests/test_api_file.py --ignore=tests/test_auth_routes.py --ignore=tests/test_sandbox_file.py
