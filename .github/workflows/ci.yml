name: CI / CD

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  nextjs_build_and_lint:
    name: Build and Lint Next.js Root
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint code
        run: yarn lint

      - name: Build Next.js application
        run: yarn build

  frontend_workspace:
    name: Vue Frontend Workspace Typecheck, Test, and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm --prefix cortex-platform/frontend install

      - name: Type-check frontend workspace
        run: npm --prefix cortex-platform/frontend run type-check

      - name: Test frontend workspace
        run: cd cortex-platform/frontend && npm test

      - name: Build frontend workspace
        run: npm --prefix cortex-platform/frontend run build

  backend_checks:
    name: Python Backend Syntax Check and Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check backend compilation
        run: python3 -m compileall -q cortex-platform/backend/app

      - name: Run backend unit tests
        run: cd cortex-platform/backend && uv run pytest -m "not e2e and not skill_github_e2e"
