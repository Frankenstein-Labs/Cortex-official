name: CI / CD

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build_and_test:
    name: Build and Lint Cortex Platform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "yarn"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install root dependencies
        run: yarn install

      - name: Install frontend workspace dependencies
        run: npm --prefix cortex-platform/frontend install

      - name: Lint Next.js site
        run: yarn lint

      - name: Typecheck Vue workspace
        run: yarn typecheck:workspace

      - name: Run Vue workspace tests
        run: npm --prefix cortex-platform/frontend run test

      - name: Check backend Python compilation
        run: yarn check:backend

      - name: Build all applications
        run: yarn build:all
