name: CI / CD

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  nextjs_site:
    name: Build and Lint Next.js Site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint Next.js code
        run: yarn lint

      - name: Build Next.js application
        run: yarn build

  frontend_workspace:
    name: Check, Test and Build Frontend Workspace
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: cortex-platform/frontend/package-lock.json

      - name: Install Frontend Workspace Dependencies
        run: npm --prefix cortex-platform/frontend ci

      - name: Typecheck Vue Workspace
        run: npm --prefix cortex-platform/frontend run type-check

      - name: Run Vue Workspace Unit Tests
        run: npm --prefix cortex-platform/frontend run test

      - name: Build Vue Workspace
        run: npm --prefix cortex-platform/frontend run build

  backend_unit_tests:
    name: Check and Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Backend Python Syntax
        run: python3 -m compileall -q cortex-platform/backend/app

      - name: Run Backend Unit Tests
        working-directory: cortex-platform/backend
        run: uv run pytest -m "not e2e and not skill_github_e2e"
