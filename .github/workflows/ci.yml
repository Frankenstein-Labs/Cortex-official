name: CI / CD

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build_and_test:
    name: Validate, Test, and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "yarn"

      - name: Setup uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install root dependencies
        run: yarn install --frozen-lockfile

      - name: Install frontend workspace dependencies
        run: cd cortex-platform/frontend && npm ci

      - name: Check backend compilation
        run: yarn check:backend

      - name: Run backend unit tests
        run: cd cortex-platform/backend && uv run pytest -m "not e2e and not skill_github_e2e"

      - name: Lint Next.js site
        run: yarn lint

      - name: Lint frontend workspace
        run: npm --prefix cortex-platform/frontend run lint

      - name: Typecheck frontend workspace
        run: yarn typecheck:workspace

      - name: Run frontend unit tests
        run: npm --prefix cortex-platform/frontend run test

      - name: Build all applications
        run: yarn build:all
