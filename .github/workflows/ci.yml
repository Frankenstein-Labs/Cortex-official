name: CI / CD

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  nextjs_site:
    name: Build and Lint Next.js Site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint Next.js code
        run: yarn lint

      - name: Build Next.js application
        run: yarn build

  frontend_workspace:
    name: Vue/Vite Frontend Workspace Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Workspace Dependencies
        run: npm --prefix cortex-platform/frontend ci

      - name: Typecheck Frontend Workspace
        run: npm --prefix cortex-platform/frontend run type-check

      - name: Test Frontend Workspace
        run: npm --prefix cortex-platform/frontend run test

      - name: Build Frontend Workspace
        run: npm --prefix cortex-platform/frontend run build

  backend_workspace:
    name: FastAPI Backend Checks & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Check Backend Syntax Compilation
        run: python3 -m compileall -q cortex-platform/backend/app

      - name: Run Backend Unit Tests
        run: |
          cd cortex-platform/backend
          uv sync
          uv run pytest -m "not e2e and not skill_github_e2e" --ignore=tests/test_api_file.py --ignore=tests/test_auth_routes.py --ignore=tests/test_sandbox_file.py
