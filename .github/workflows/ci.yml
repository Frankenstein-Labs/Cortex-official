name: CI / CD

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build_and_test:
    name: Build, Lint and Test Platform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "yarn"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install root dependencies
        run: yarn install --frozen-lockfile

      - name: Install workspace frontend dependencies
        run: npm --prefix cortex-platform/frontend install

      - name: Lint Next.js site
        run: yarn lint

      - name: Build Next.js application
        run: yarn build

      - name: Typecheck Vue workspace
        run: yarn typecheck:workspace

      - name: Test Vue workspace frontend
        run: yarn test:frontend

      - name: Build Vue workspace frontend
        run: yarn build:workspace

      - name: Check Python backend syntax
        run: yarn check:backend

      - name: Test Python backend
        run: yarn test:backend
