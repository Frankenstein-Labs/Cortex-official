name: CI / CD

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build_and_test:
    name: Build and Lint Next.js
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint code
        run: yarn lint

      - name: Build Next.js application
        run: yarn build

      - name: Install frontend workspace dependencies
        run: npm --prefix cortex-platform/frontend ci

      - name: Typecheck frontend workspace
        run: yarn typecheck:workspace

      - name: Build frontend workspace
        run: yarn build:workspace

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check backend code compilation
        run: yarn check:backend
