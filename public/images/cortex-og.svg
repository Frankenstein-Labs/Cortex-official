  <text x="92" y="300" fill="#fff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="66" font-weight="700" letter-spacing="-2">Build software with</text>
  <text x="92" y="382" fill="url(#accent)" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="76" font-weight="750" letter-spacing="-2">context and control.</text>
  <text x="98" y="454" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="26">An AI workspace for conversations, files and development tools.</text>
