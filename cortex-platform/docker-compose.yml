services:
  frontend:
    image: ${IMAGE_REGISTRY:-ghcr.io/frankenstein-labs}/cortex-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      x-bake:
        platforms:
          - linux/amd64
          - linux/arm64
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - cortex-network
    environment:
      - BACKEND_URL=http://backend:8000

  backend:
    image: ${IMAGE_REGISTRY:-ghcr.io/frankenstein-labs}/cortex-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
      x-bake:
        platforms:
          - linux/amd64
          - linux/arm64
    depends_on:
      - sandbox
      - mongodb
      - redis
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      #- ./mcp.json:/etc/mcp.json # Mount MCP servers directory
    networks:
      - cortex-network
    env_file:
      - .env

  sandbox:
    image: cortex-sandbox:local
    build:
      context: ./sandbox
      dockerfile: Dockerfile
      x-bake:
        platforms:
          - linux/amd64
          - linux/arm64
    command: /bin/sh -c "exit 0" # Build the image; DockerSandbox creates one container per task.
    restart: "no"
    networks:
      - cortex-network

  mongodb:
    image: mongo:7.0
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    #ports:
    #  - "27017:27017"
    networks:
      - cortex-network

  redis:
    image: redis:7.0
    restart: unless-stopped
    networks:
      - cortex-network

volumes:
  mongodb_data:
    name: cortex-mongodb-data

networks:
  cortex-network:
    name: cortex-network
    driver: bridge
